.privacy{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);border-radius:999px;padding:5px 12px;font-size:.85rem;line-height:1.3}
.privacy svg{flex:none}
.banner{padding:10px 0;font-size:.95rem}
.banner .container{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.banner.demo{background:#fff4ce;color:#5c4400;border-bottom:1px solid #f1d98a}
.banner.error{background:var(--danger-bg);color:var(--danger)}
.banner .btn{min-height:44px;padding:4px 12px;font-size:.95rem}

/* カード・ボタン */
.card{background:var(--card);border-radius:var(--radius);padding:14px 16px;margin:12px 0;box-shadow:0 1px 2px rgba(16,24,40,.06)}
.card h2{font-size:1.05rem;margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 .opt{font-size:.95rem;color:var(--muted);font-weight:400}
.help{color:var(--muted);font-size:.95rem;margin:4px 0 8px}
.help.small{font-size:.95rem}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:8px 14px;border-radius:10px;border:1.5px solid var(--border);background:#fff;font-size:1rem;line-height:1.25;text-align:center;text-decoration:none;color:var(--text)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:700}
.btn.outline{border-color:var(--primary);color:var(--primary-dark);font-weight:700}
.btn.danger{color:var(--danger);border-color:#f0b8b1;background:#fff}
.btn.block{display:flex;width:100%}
.btn.small{min-height:44px;padding:6px 12px;font-size:.95rem}
.btn[disabled]{opacity:.4;cursor:default;transform:none}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn-row .btn{flex:1 1 auto}
.btn-row.right{justify-content:flex-end}
.center{text-align:center;margin:14px 0}
.field{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.field label{font-weight:600}
.lbl{font-weight:600;min-width:4.5em}

/* 選択ボタン（セグメント・チップ） */
.seg{display:grid;gap:6px}
.seg.c2{grid-template-columns:repeat(2,1fr)}
.seg.c3{grid-template-columns:repeat(3,1fr)}
.seg.c4{grid-template-columns:repeat(4,1fr)}
.seg .btn{padding:6px 4px;flex-direction:column;gap:1px;min-height:50px}
.seg .btn .sub{font-size:.88rem;color:var(--muted);font-weight:400;line-height:1.2}
.seg .btn .big{font-size:1.35rem;line-height:1.1;display:block}
.btn[aria-pressed="true"]{border-color:var(--primary-dark);border-width:2.5px;background:var(--primary-light);font-weight:700;box-shadow:inset 0 0 0 1px var(--primary-dark)}
.seg .btn[aria-pressed="true"]::before{content:"✓";position:absolute;top:2px;left:6px;font-size:.8rem;line-height:1;font-weight:700}
.btn.lvl.p0[aria-pressed="true"]{background:var(--p0-bg);color:var(--p0-fg)}
.btn.lvl.p1[aria-pressed="true"]{background:var(--p1-bg);color:var(--p1-fg)}
.btn.lvl.p2[aria-pressed="true"]{background:var(--p2-bg);color:var(--p2-fg)}
.btn.lvl.p3[aria-pressed="true"]{background:var(--p3-bg);color:var(--p3-fg);border-color:#7a1414;box-shadow:inset 0 0 0 1px #7a1414}
.quick{margin:4px 0 10px;flex-direction:column;gap:2px}
.quick .sub{display:block;font-size:.9rem;font-weight:400;color:var(--muted)}
.quick[aria-pressed="true"] .sub{color:var(--primary-dark)}
.slot{margin:10px 0 4px}
.slot .slot-label{font-weight:700;margin-bottom:4px}
.legend-pain{font-size:.95rem;color:var(--muted);margin:6px 0 10px;display:grid;gap:3px}
.legend-pain b{color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--border);background:#fff;font-size:1rem;line-height:1.25;color:var(--text)}
.chip[aria-pressed="true"]{border-color:var(--primary-dark);background:var(--primary-light);font-weight:700;border-width:2.5px}
.chip.add{border-color:var(--primary);color:var(--primary-dark);font-weight:700}
.chip.ghost{border-style:dashed;color:var(--muted)}
.chip.small{min-height:44px;padding:4px 12px;font-size:.95rem}
.chip:active{transform:scale(.98)}

/* 日付 */
.datebar{display:grid;grid-template-columns:62px 1fr 62px;align-items:center;gap:6px}
.datebar .date{text-align:center}
.datebar .date-text{font-weight:700;font-size:1.12rem}
.nav-day{padding:4px 0;flex-direction:column;gap:0;min-height:52px;white-space:nowrap}
.nav-day span[aria-hidden]{font-size:1.5rem;line-height:1}
.nav-day .tiny{font-size:.8rem;color:var(--muted);white-space:nowrap}
.badges{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:2px}
.badge{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.85rem;font-weight:700;line-height:1.5}
.badge.today{background:var(--primary-light);color:var(--primary-dark)}
.badge.done{background:var(--ok-bg);color:var(--ok)}
.badge.none{background:#eef1f4;color:var(--muted)}
input[type=time],input[type=date],input[type=text]{min-height:46px;border:1.5px solid var(--border);border-radius:10px;padding:6px 10px;font-size:1rem;background:#fff;max-width:100%;-webkit-appearance:none;appearance:none}
input[type=text]{flex:1 1 160px}
input[type=time],input[type=date]{min-width:8.5em}
input::-webkit-date-and-time-value{text-align:left;min-height:1.3em}
textarea{width:100%;min-height:84px;border:1.5px solid var(--border);border-radius:10px;padding:10px;font-size:1rem;line-height:1.5;resize:vertical;background:#fff}

/* 薬 */
.med{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin:8px 0;background:#fbfcfd}
.med-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.med-name{font-weight:700;font-size:1.05rem}
.med .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.med .row .seg{flex:1 1 240px}
.newmed{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.newmed .btn{flex:0 0 auto}

/* 折りたたみ */
.collapse-head{display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:0;padding:4px 0;min-height:44px;text-align:left}
.collapse-head h2{margin:0}
.collapse-head .chev{color:var(--muted);font-size:.95rem;flex:none;margin-left:8px}

/* カレンダー */
.monthbar{display:grid;grid-template-columns:62px 1fr 62px;align-items:center;gap:6px;margin-bottom:8px}
.monthbar .month{text-align:center;font-weight:700;font-size:1.15rem}
.monthbar .thismonth-btn{display:block;margin:4px auto 0;font-weight:400}
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:.85rem;color:var(--muted);margin-bottom:4px}
.cal-head .sun{color:#b42318}.cal-head .sat{color:#1e40af}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-cell{position:relative;min-height:64px;border:1px solid var(--border);border-radius:8px;background:#fff;padding:18px 2px 16px;display:flex;align-items:center;justify-content:center;color:var(--text)}
.cal-cell.empty{background:transparent;border-color:transparent}
.cal-cell.today{border-color:var(--primary);border-width:2px}
.cal-cell.future{background:#f7f9fb}
.cal-cell[disabled]{cursor:default}
.cal-cell .d{position:absolute;top:3px;left:5px;font-size:.82rem;color:var(--muted);line-height:1;font-weight:600}
.cal-cell.sun .d{color:#b42318}.cal-cell.sat .d{color:#1e40af}
.sym{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;font-weight:700;font-size:1rem;line-height:1;flex:none}
.sym.p0{background:var(--p0-bg);color:var(--p0-fg)}
.sym.p1{background:var(--p1-bg);color:var(--p1-fg)}
.sym.p2{background:var(--p2-bg);color:var(--p2-fg)}
.sym.p3{background:var(--p3-bg);color:var(--p3-fg)}
.cal-cell .marks{position:absolute;bottom:2px;left:1px;right:1px;display:flex;justify-content:center;gap:2px}
.mark{font-size:.7rem;line-height:1.25;border-radius:4px;padding:0 3px;font-weight:700;white-space:nowrap}
.mark.med{background:var(--med-bg);color:var(--med-fg)}
.mark.mens{background:var(--mens-bg);color:var(--mens-fg)}
.legend{font-size:.95rem;color:var(--muted);margin-top:10px;display:grid;gap:6px}
.legend .row{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.legend .item{display:inline-flex;align-items:center;gap:4px}
.legend b{color:var(--text)}

/* 集計 */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:#fbfcfd}
.stat .k{font-size:.95rem;color:var(--muted);line-height:1.3}
.stat .v{font-size:1.55rem;font-weight:700;line-height:1.2}
.stat .v small{font-size:.9rem;font-weight:400}
.stat .note{font-size:.95rem;color:var(--muted)}
.medlist{margin:6px 0 0;padding:0;list-style:none}
.medlist li{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)}
.medlist li:last-child{border-bottom:0}
.medlist .n{font-weight:700}
.doctor-note{margin-top:10px;padding:10px 12px;background:#f7f9fb;border-radius:8px;font-size:.95rem}

/* 医師に見せる */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:8px -16px 4px;padding:0 16px}
.doc{border-collapse:collapse;width:100%;table-layout:fixed;font-size:.88rem;background:#fff}
.doc th,.doc td{border:1px solid var(--border);padding:4px 3px;text-align:center;vertical-align:middle;overflow-wrap:anywhere;word-break:break-all}
.doc th{background:#eef3f6;font-weight:700;line-height:1.2}
.doc td.l{text-align:left}
.doc td.day{font-weight:600;line-height:1.2}
.doc td.day small{font-weight:400;color:var(--muted);margin-left:1px;display:block;font-size:.8rem}
.doc tr.sun td.day{color:#b42318}.doc tr.sat td.day{color:#1e40af}
.doc tr.future td{color:var(--muted);background:#fafbfc}
.doc td.p0{background:var(--p0-bg);color:var(--p0-fg)}
.doc td.p1{background:var(--p1-bg);color:var(--p1-fg);font-weight:700}
.doc td.p2{background:var(--p2-bg);color:var(--p2-fg);font-weight:700}
.doc td.p3{background:var(--p3-bg);color:var(--p3-fg);font-weight:700}
.doc td.mens{color:var(--mens-fg);font-weight:700}
.stats.compact .stat{padding:8px 10px}
.stats.compact .v{font-size:1.3rem}

/* 設定 */
.status-list{margin:0;padding:0;list-style:none}
.status-list li{padding:6px 0;border-bottom:1px solid var(--border)}
.status-list li:last-child{border-bottom:0}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;background:#fff;border:1.5px solid var(--border);border-radius:10px;padding:10px 14px;min-height:52px;text-align:left}
.switch .state{font-weight:700;color:var(--muted)}
.switch[aria-checked="true"] .state{color:var(--primary-dark)}
.candlist{list-style:none;margin:0;padding:0}
.candlist li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)}
.candlist li:last-child{border-bottom:0}
.filebtn input{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.filebtn{position:relative;overflow:hidden}
.filebtn:focus-within{outline:3px solid #ffbf47;outline-offset:2px}
.reminder{border:2px solid #e8c660;background:#fff8e1}
.reminder h2{color:#5c4400}
.step-list li{margin:.4em 0}
.danger-zone{border:1px solid #f0b8b1}
.footer{color:var(--muted);font-size:.9rem;text-align:center;margin:18px 0 6px}

/* 注意書き */
.notice{border-left:4px solid var(--primary);background:#fff;padding:10px 12px;margin:10px 0;font-size:.95rem;border-radius:0 8px 8px 0}
.notice.emergency{border-left-color:var(--danger);background:#fff7f6}
.notice.privacy-note{border-left-color:var(--ok)}

/* 下のナビ */
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom);z-index:20}
.nav .container{display:flex;padding:0}
.nav button{flex:1;min-height:var(--nav-h);border:0;background:none;color:var(--muted);font-size:clamp(13px,3.8vw,16px);font-weight:600;border-top:3px solid transparent;padding:4px 2px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.2}
.nav button[aria-current="page"]{color:var(--primary-dark);border-top-color:var(--primary)}
.nav svg{width:22px;height:22px;flex:none}

/* モーダル・トースト */
#modal:empty{display:none}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:#fff;border-radius:14px;padding:18px;max-width:460px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.modal h3{font-size:1.1rem;margin:0 0 10px}
.modal .btn-row{flex-direction:column}
.modal .btn-row .btn{width:100%}
.modal .hint{font-size:.88rem;color:var(--muted);margin:-4px 0 6px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 14px);transform:translateX(-50%);background:#1b1f23;color:#fff;padding:10px 18px;border-radius:999px;font-size:.95rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;max-width:92vw;text-align:center}
.toast.show{opacity:.95}

@media (min-width:600px){
  .stats{grid-template-columns:repeat(3,1fr)}
  .cal-cell{min-height:72px}
  .doc{font-size:.95rem}
  .doc th,.doc td{padding:5px 6px}
  .doc td.day small{display:inline;font-size:.85rem}
}
@media (max-width:359px){
  .seg.c4{gap:4px}
  .seg.c4 .btn{padding:6px 0;font-size:.95rem}
  .datebar,.monthbar{grid-template-columns:56px 1fr 56px}
}

/* 印刷（A4 縦 1枚） */
#print-sheet{display:none}
@media print{
  @page{size:A4 portrait;margin:10mm}
  html{font-size:10pt;background:#fff}
  body{background:#fff;padding:0!important;color:#000;line-height:1.3}
  #app,#modal,#toast,.nav{display:none!important}
  #print-sheet{display:block!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .ph{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1.5pt solid #000;padding-bottom:1.5mm;gap:4mm}
  .ph .t{font-size:14pt;font-weight:700}
  .ph .t span{font-size:11pt;font-weight:400;margin-left:3mm}
  .ph .c{font-size:9pt;text-align:right}
  .blanks{font-size:10pt;margin:2mm 0 2mm;display:flex;align-items:flex-end;gap:5mm;flex-wrap:wrap}
  .blanks .line{display:inline-block;border-bottom:1pt solid #000;width:58mm;height:7mm;vertical-align:bottom;margin-left:1.5mm}
  .blanks .line.short{width:36mm}
  .blanks .hint{font-size:8pt;color:#333}
  .pt{width:100%;border-collapse:collapse;table-layout:fixed;font-size:9pt}
  .pt th,.pt td{border:0.5pt solid #000;padding:0.7mm 1mm;line-height:1.25;vertical-align:middle;text-align:center;overflow:hidden}
  .pt th{background:#e6e6e6;font-weight:700}
  .pt td.l{text-align:left}
  .pt td.day{white-space:nowrap}
  .pt td.day small{font-size:7.5pt;margin-left:0.5mm}
  .pt td.p0{color:#555}
  .pt td.p1{background:#fff0b3}
  .pt td.p2{background:#ffd3a6;font-weight:700}
  .pt td.p3{background:#f3a6a6;font-weight:700}
  .pt .cell{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;word-break:break-all}
  .pt tr{page-break-inside:avoid;break-inside:avoid}
  .ps{display:grid;grid-template-columns:repeat(5,1fr);gap:1.5mm;margin-top:2.5mm;font-size:9pt}
  .ps .box{border:0.5pt solid #000;padding:1mm 1.5mm;border-radius:1mm}
  .ps .box .k{font-size:7.5pt;line-height:1.2}
  .ps .box .v{font-size:12pt;font-weight:700;line-height:1.2}
  .ps .box .v small{font-size:8pt;font-weight:400}
  .ps .box.wide{grid-column:1 / -1;font-size:9pt}
  .ps .box.wide b{margin-right:2mm}
  .pl{font-size:7.5pt;margin-top:2mm;line-height:1.4}
  .pn{font-size:7.5pt;margin-top:1.5mm;border-top:0.5pt solid #000;padding-top:1mm;display:flex;justify-content:space-between;gap:4mm}
}
</style>
</head>
<body>
<div id="app">
  <header class="app-header">
    <div class="container">
      <h1><span id="appTitle">頭痛ダイアリー</span><span class="clinic" id="clinicName"></span></h1>
      <span class="privacy" id="privacyBadge"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2" fill="currentColor"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2"/></svg><span id="privacyText"></span></span>
    </div>
  </header>
  <div id="banners"></div>
  <main class="container" id="view"></main>
  <nav class="nav" aria-label="画面の切り替え"><div class="container" id="navButtons"></div></nav>
</div>
<div id="print-sheet" aria-hidden="true"></div>
<div id="modal"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(function () {
'use strict';
const C = CONFIG, T = C.text, O = C.options, N = C.notices;
const SLOTS = O.timeSlots;
const WD = ['日', '月', '火', '水', '木', '金', '土'];
const DEMO = new URLSearchParams(location.search).has('demo');
const $ = (s, el) => (el || document).querySelector(s);

/* ---------- ユーティリティ ---------- */
const pad2 = n => (n < 10 ? '0' : '') + n;
const ymd = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const parseYmd = s => { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const validDate = s => /^\d{4}-\d{2}-\d{2}$/.test(s) && ymd(parseYmd(s)) === s;
const todayStr = () => ymd(new Date());
const daysInMonth = (y, m) => new Date(y, m, 0).getDate();
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const addMonths = (ym, n) => { const p = ym.split('-').map(Number); const d = new Date(p[0], p[1] - 1 + n, 1); return d.getFullYear() + '-' + pad2(d.getMonth() + 1); };
const fmtDate = s => { const d = parseYmd(s); return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日（' + WD[d.getDay()] + '）'; };
const fmtMonth = ym => { const p = ym.split('-').map(Number); return p[0] + '年' + p[1] + '月'; };
const fmtIsoDate = iso => { const d = new Date(iso); return isNaN(d) ? '' : d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日'; };
const nowHM = () => { const d = new Date(); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (s, vars) => String(s).replace(/\{(\w+)\}/g, (_, k) => (vars && vars[k] != null ? vars[k] : ''));
const levelOf = v => O.painLevels.find(l => l.value === v);
const impactOf = v => O.impactLevels.find(l => l.value === v);
const effectOf = id => O.effects.find(e => e.id === id);
const shortTime = t => (t || '').replace(/^0(\d:)/, '$1');

/* ---------- データ ---------- */
function emptyData() {
  return {
    version: 1,
    settings: { showMenstruation: C.features.menstruationDefault, firstUseAt: null, lastExportAt: null, lastReminderAt: null },
    meds: [],
    days: {},
  };
}
function emptyDay() {
  const pain = {};
  SLOTS.forEach(s => { pain[s.id] = null; });
  return { pain, impact: null, meds: [], menstruation: false, painType: null, symptoms: [], triggers: [], memo: '' };
}
function isEmptyDay(day) {
  return SLOTS.every(s => day.pain[s.id] == null) && day.impact == null && !day.meds.length && !day.menstruation
    && !day.painType && !day.symptoms.length && !day.triggers.length && !(day.memo && day.memo.trim());
}
function hasOptional(day) {
  return !!(day.painType || day.symptoms.length || day.triggers.length || (day.memo && day.memo.trim()));
}
function maxPain(day) {
  const vals = SLOTS.map(s => day.pain[s.id]).filter(v => v != null);
  return vals.length ? Math.max.apply(null, vals) : null;
}
/* 読み込んだデータを安全な形に整える（壊れた値・知らない値は捨てる） */
function normalize(raw) {
  const d = emptyData();
  if (!raw || typeof raw !== 'object') return d;
  if (raw.settings && typeof raw.settings === 'object') {
    const s = raw.settings;
    if (typeof s.showMenstruation === 'boolean') d.settings.showMenstruation = s.showMenstruation;
    ['firstUseAt', 'lastExportAt', 'lastReminderAt'].forEach(k => { if (typeof s[k] === 'string' && !isNaN(Date.parse(s[k]))) d.settings[k] = s[k]; });
  }
  if (Array.isArray(raw.meds)) d.meds = raw.meds.filter(x => typeof x === 'string' && x.trim()).map(x => x.trim().slice(0, 40)).slice(0, 60);
  if (raw.days && typeof raw.days === 'object') {
    Object.keys(raw.days).forEach(k => {
      const v = raw.days[k];
      if (!validDate(k) || !v || typeof v !== 'object') return;
      const day = emptyDay();
      SLOTS.forEach(s => { const p = v.pain && v.pain[s.id]; day.pain[s.id] = levelOf(p) ? p : null; });
      day.impact = impactOf(v.impact) ? v.impact : null;
      day.meds = Array.isArray(v.meds) ? v.meds.filter(m => m && typeof m.name === 'string' && m.name.trim()).map(m => ({
        name: m.name.trim().slice(0, 40),
        time: typeof m.time === 'string' && /^\d{2}:\d{2}$/.test(m.time) ? m.time : '',
        effect: effectOf(m.effect) ? m.effect : null,
      })).slice(0, 20) : [];
      day.menstruation = v.menstruation === true;
      day.painType = O.painTypes.some(p => p.id === v.painType) ? v.painType : null;
      day.symptoms = Array.isArray(v.symptoms) ? O.symptoms.map(o => o.id).filter(id => v.symptoms.indexOf(id) >= 0) : [];
      day.triggers = Array.isArray(v.triggers) ? O.triggers.map(o => o.id).filter(id => v.triggers.indexOf(id) >= 0) : [];
      day.memo = typeof v.memo === 'string' ? v.memo.slice(0, 500) : '';
      if (typeof v.updatedAt === 'string') day.updatedAt = v.updatedAt;
      if (!isEmptyDay(day)) d.days[k] = day;
    });
  }
  // 記録に出てくる薬の名前は候補にも入れておく
  Object.keys(d.days).forEach(k => d.days[k].meds.forEach(m => { if (d.meds.indexOf(m.name) < 0 && d.meds.length < 60) d.meds.push(m.name); }));
  return d;
}

/* ---------- 集計 ---------- */
function monthStats(ym) {
  const p = ym.split('-').map(Number);
  const n = daysInMonth(p[0], p[1]);
  const st = { daysInMonth: n, recorded: 0, headache: 0, severe: 0, impactAny: 0, impactMajor: 0, medDays: 0, byMed: [] };
  const byMed = {};
  for (let d = 1; d <= n; d++) {
    const day = data.days[ym + '-' + pad2(d)];
    if (!day) continue;
    st.recorded++;
    const mp = maxPain(day);
    if (mp != null && mp >= 1) st.headache++;
    if (mp === 3) st.severe++;
    if (day.impact != null && day.impact >= 1) st.impactAny++;
    if (day.impact === 2) st.impactMajor++;
    if (day.meds.length) {
      st.medDays++;
      const names = {};
      day.meds.forEach(m => { names[m.name] = true; });
      Object.keys(names).forEach(nm => { byMed[nm] = (byMed[nm] || 0) + 1; });
    }
  }
  st.byMed = Object.keys(byMed).map(nm => ({ name: nm, days: byMed[nm] })).sort((a, b) => b.days - a.days || a.name.localeCompare(b.name, 'ja'));
  return st;
}

/* ---------- 見本データ（?demo） ---------- */
function makeDemoData() {
  const d = emptyData();
  d.meds = C.demo.medNames.slice();
  let seed = 2463534242;
  const rnd = () => { seed ^= seed << 13; seed >>>= 0; seed ^= seed >>> 17; seed ^= seed << 5; seed >>>= 0; return (seed % 100000) / 100000; };
  const pick = arr => arr[Math.floor(rnd() * arr.length)];
  const today = todayStr();
  const start = addMonths(today.slice(0, 7), -1) + '-01';
  for (let key = start; key <= today; key = addDays(key, 1)) {
    const dayNum = Number(key.slice(8));
    const r = rnd();
    const mens = dayNum >= 12 && dayNum <= 16;
    if (r < 0.08) continue; // 記録しなかった日
    const day = emptyDay();
    day.menstruation = mens;
    if (r < 0.6 && !(mens && rnd() < 0.6)) {
      SLOTS.forEach(s => { day.pain[s.id] = 0; });
      day.impact = 0;
      if (rnd() < 0.15) day.memo = pick(C.demo.memosNone);
    } else {
      const sev = rnd();
      const max = sev < 0.45 ? 1 : sev < 0.8 ? 2 : 3;
      const startSlot = Math.floor(rnd() * 3);
      const pain = [0, 0, 0];
      pain[startSlot] = max;
      if (startSlot < 2 && rnd() < 0.6) pain[startSlot + 1] = Math.max(1, max - (rnd() < 0.5 ? 1 : 0));
      if (startSlot === 0 && rnd() < 0.3) pain[2] = 1;
      SLOTS.forEach((s, i) => { day.pain[s.id] = pain[i]; });
      day.impact = max === 3 ? 2 : max === 2 ? (rnd() < 0.6 ? 1 : 2) : (rnd() < 0.3 ? 1 : 0);
      if (max >= 2 || rnd() < 0.4) {
        const name = max >= 2 && rnd() < 0.5 ? d.meds[1] : d.meds[0];
        const hour = startSlot === 0 ? 8 + Math.floor(rnd() * 4) : startSlot === 1 ? 13 + Math.floor(rnd() * 5) : 19 + Math.floor(rnd() * 3);
        const eff = rnd();
        day.meds.push({ name, time: pad2(hour) + ':' + pad2([0, 15, 30, 45][Math.floor(rnd() * 4)]), effect: eff < 0.5 ? 'good' : eff < 0.85 ? 'some' : 'none' });
        if (max === 3 && rnd() < 0.6) day.meds.push({ name: d.meds[0], time: pad2(Math.min(23, hour + 5)) + ':00', effect: rnd() < 0.5 ? 'some' : 'none' });
      }
      day.painType = max >= 2 ? (rnd() < 0.75 ? 'throb' : 'tight') : (rnd() < 0.6 ? 'tight' : 'throb');
      if (max >= 2) {
        if (rnd() < 0.6) day.symptoms.push('nausea');
        if (rnd() < 0.5) day.symptoms.push('photo');
        if (rnd() < 0.3) day.symptoms.push('phono');
        if (rnd() < 0.25) day.symptoms.push('aura');
      }
      if (rnd() < 0.2) day.symptoms.push('dizzy');
      if (rnd() < 0.7) day.triggers.push(pick(O.triggers).id);
      if (rnd() < 0.2) day.triggers.push(pick(O.triggers).id);
      day.triggers = O.triggers.map(t => t.id).filter(id => day.triggers.indexOf(id) >= 0);
      if (rnd() < 0.45) day.memo = pick(C.demo.memosHeadache);
    }
    day.updatedAt = new Date(parseYmd(key).getTime() + 22 * 3600000).toISOString();
    d.days[key] = day;
  }
  d.settings.firstUseAt = new Date(Date.now() - 50 * 86400000).toISOString();
  d.settings.lastExportAt = new Date(Date.now() - 40 * 86400000).toISOString();
  return d;
}

function parseHash() {
  const h = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
  const parts = h.split('/');
  route.view = VIEWS.indexOf(parts[0]) >= 0 ? parts[0] : 'record';
  const arg = parts[1] || '';
  const today = todayStr();
  if (route.view === 'record') {
    if (validDate(arg)) route.date = arg > today ? today : arg;
    else if (!arg) route.date = route.date || today;
  } else if (route.view === 'month' || route.view === 'doctor') {
    if (/^\d{4}-(0[1-9]|1[0-2])$/.test(arg)) route.month = arg;
  }
  if (route.date > today) route.date = today;
}

  const target = '#' + view + (arg ? '/' + arg : '');
  if (location.hash === target) { parseHash(); render(); }

}

/* ---------- 画面：月のまとめ（カレンダー） ---------- */
function viewMonth(ym) {
  const p = ym.split('-').map(Number);
  const n = daysInMonth(p[0], p[1]);
  const first = new Date(p[0], p[1] - 1, 1);
  const offset = (first.getDay() - C.app.weekStart + 7) % 7;
  const today = todayStr();
  const st = monthStats(ym);
  const cells = [];
  for (let i = 0; i < offset; i++) cells.push('<div class="cal-cell empty" aria-hidden="true"></div>');
  for (let d = 1; d <= n; d++) {
    const key = ym + '-' + pad2(d);
    const dow = new Date(p[0], p[1] - 1, d).getDay();
    const day = data.days[key];
    const mp = day ? maxPain(day) : null;
    const lvl = mp == null ? null : levelOf(mp);
    const future = key > today;
    const hasMed = !!(day && day.meds.length), mens = !!(day && day.menstruation);
    const label = [p[1] + '月' + d + '日（' + WD[dow] + '）', lvl ? lvl.label : (day ? '' : T.notRecordedBadge), hasMed ? T.legendMed : '', mens ? T.legendMens : ''].filter(Boolean).join('、');
    cells.push('<button type="button" class="cal-cell' + (key === today ? ' today' : '') + (future ? ' future' : '') + (dow === 0 ? ' sun' : dow === 6 ? ' sat' : '') + '" data-action="cal-day" data-date="' + key + '" ' + (future ? 'disabled' : '') + ' aria-label="' + esc(label) + '">'
      + '<span class="d" aria-hidden="true">' + d + '</span>'
      + (lvl ? '<span class="sym ' + lvl.cls + '" aria-hidden="true">' + esc(lvl.symbol) + '</span>' : '')
      + '<span class="marks" aria-hidden="true">' + (hasMed ? '<span class="mark med">' + esc(T.markMed) + '</span>' : '') + (mens ? '<span class="mark mens">' + esc(T.markMens) + '</span>' : '') + '</span></button>');
  }
  const heads = [];
  for (let i = 0; i < 7; i++) { const w = (i + C.app.weekStart) % 7; heads.push('<div class="' + (w === 0 ? 'sun' : w === 6 ? 'sat' : '') + '">' + WD[w] + '</div>'); }

  let h = '<section class="card"><h2>' + esc(T.monthTitle) + '</h2>' + monthBar(ym)
    + '<div class="cal-head" aria-hidden="true">' + heads.join('') + '</div><div class="cal">' + cells.join('') + '</div>'
    + '<p class="help" style="margin-top:8px">' + esc(T.calHint) + '</p>'
    + '<div class="legend"><div class="row"><b>' + esc(T.legendPain) + '</b>' + O.painLevels.map(l => '<span class="item"><span class="sym ' + l.cls + '">' + esc(l.symbol) + '</span>' + esc(l.label) + '</span>').join('') + '<span class="item">' + esc(T.legendNoRecord) + '</span></div>'
    + '<div class="row"><span class="item"><span class="mark med">' + esc(T.markMed) + '</span>＝' + esc(T.legendMed) + '</span><span class="item"><span class="mark mens">' + esc(T.markMens) + '</span>＝' + esc(T.legendMens) + '</span></div></div>'
    + '</section>';
  h += '<section class="card"><h2>' + esc(T.statsTitle) + '<span class="opt">' + fmtMonth(ym) + '</span></h2>' + statsHtml(st, false)
    + '<div class="btn-row"><button type="button" class="btn primary block" data-action="to-doctor">' + esc(T.toDoctor) + '</button></div></section>';
  h += noticesHtml();
  return h;
}

/* ---------- トースト・モーダル ---------- */
let toastTimer = null, lastSavedToast = 0;
function toast(msg, ms) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), ms || 1800);
}
function savedToast() {
  const now = Date.now();
  if (now - lastSavedToast < 2500) return;
  lastSavedToast = now;
  toast(T.saved, 1200);
}
let modalButtons = null;
function showModal(o) {
  modalButtons = o.buttons;
  $('#modal').innerHTML = '<div class="modal-bg" data-action="modal-bg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">'
    + '<h3 id="modalTitle">' + o.title + '</h3><div class="modal-body">' + o.body + '</div>'
    + '<div class="btn-row">' + o.buttons.map((b, i) => (b.hint ? '<p class="hint">' + esc(b.hint) + '</p>' : '') + '<button type="button" class="btn ' + (b.cls || '') + '" data-action="modal-btn" data-i="' + i + '">' + esc(b.label) + '</button>').join('') + '</div></div></div>';
  const first = $('#modal .btn');
  if (first) first.focus();
}
function closeModal() { $('#modal').innerHTML = ''; modalButtons = null; }

/* ---------- 書き出し・読み込み ---------- */
function payload() {
  return JSON.stringify({ app: C.app.exportTag, version: 1, exportedAt: new Date().toISOString(), clinic: C.clinic.name, settings: data.settings, meds: data.meds, days: data.days }, null, 1);
}
function fileName() { return C.app.exportFilePrefix + '_' + todayStr().replace(/-/g, '') + '.json'; }
function markExported() {
  data.settings.lastExportAt = new Date().toISOString();
  data.settings.lastReminderAt = null;
  save();
  render();
  toast(T.exported);
}
function exportFile() {
  try {
    const blob = new Blob([payload()], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = fileName(); a.rel = 'noopener'; a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 3000);
    markExported();
  } catch (e) {
    console.warn(e);
    toast(T.exportFailed, 3500);
  }
}
function canShareFiles() {
  try { return !!(navigator.share && navigator.canShare && navigator.canShare({ files: [new File(['x'], 'x.json', { type: 'application/json' })] })); } catch (e) { return false; }
}
function exportShare() {
  let p;
  try { p = navigator.share({ files: [new File([payload()], fileName(), { type: 'application/json' })], title: C.app.title }); }
  catch (e) { toast(T.shareFailed); return; }
  p.then(markExported).catch(e => { if (!e || e.name !== 'AbortError') toast(T.shareFailed); });
}
function exportCopy() {
  const text = payload();
  const fail = () => { ui.copyFallback = text; render(); toast(T.copyFailed, 4000); const ta = $('#copyArea'); if (ta) { ta.focus(); ta.select(); } };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => { ui.copyFallback = ''; markExported(); toast(T.copied, 3500); }).catch(fail);
  } else fail();
}
function readImportFile(f) {
  const r = new FileReader();
  r.onload = () => importText(String(r.result || ''));
  r.onerror = () => toast(T.importInvalid, 3500);
  r.readAsText(f);
}
function importText(text) {
  let obj = null;
  try { obj = JSON.parse(String(text || '').trim()); } catch (e) { obj = null; }
  if (!obj || typeof obj !== 'object' || !obj.days || typeof obj.days !== 'object') { toast(T.importInvalid, 3500); return; }
  const norm = normalize(obj);
  const keys = Object.keys(norm.days).sort();
  if (!keys.length) { toast(T.importEmpty, 3500); return; }
  showModal({
    title: esc(T.importConfirmTitle),
    body: '<p>' + esc(fmt(T.importConfirmBody, { n: keys.length, from: fmtDate(keys[0]), to: fmtDate(keys[keys.length - 1]) })) + '</p>',
    buttons: [
      { label: T.importMerge, cls: 'primary', hint: T.importMergeHint, onClick() {
        Object.keys(norm.days).forEach(k => { data.days[k] = norm.days[k]; });
        norm.meds.forEach(nm => { if (data.meds.indexOf(nm) < 0) data.meds.push(nm); });
        ui.pasteOpen = false; save(); render(); toast(T.imported);
      } },
      { label: T.importReplace, cls: 'danger', onClick() {
        const keep = data.settings.showMenstruation;
        data = norm;
        data.settings.showMenstruation = keep;
        ui.pasteOpen = false; save(); render(); toast(T.imported);
      } },
      { label: T.cancel },
    ],
  });
}

/* ---------- 操作 ---------- */
let memoTimer = null;
function scheduleMemoCommit() {
  clearTimeout(memoTimer);
  memoTimer = setTimeout(() => { memoTimer = null; commitDay(route.date, true); }, 700);
}
function flushMemo() {
  if (memoTimer) { clearTimeout(memoTimer); memoTimer = null; commitDay(route.date, true); }
}
function addMed(name) {
  const day = ensureDay(route.date);
  day.meds.push({ name, time: route.date === todayStr() ? nowHM() : '', effect: null });
  if (data.meds.indexOf(name) < 0) data.meds.push(name);
  ui.newMedOpen = false; ui.newMedDraft = '';
  commitDay(route.date);
  render();
}
function setMedTime(i, time, noRender) {
  const day = ensureDay(route.date);
  const m = day.meds[i];
  if (!m) return;
  m.time = /^\d{2}:\d{2}$/.test(time) ? time : '';
  commitDay(route.date);
  if (!noRender) render();
}
function toggleIn(arr, v) { const i = arr.indexOf(v); if (i >= 0) arr.splice(i, 1); else arr.push(v); }

const actions = {
  nav(el) {
    const v = el.dataset.view;
    if (v === 'record') go('record', route.date);
    else if (v === 'month' || v === 'doctor') go(v, route.view === 'record' ? route.date.slice(0, 7) : route.month);
    else go(v);
  },
  go(el) { go(el.dataset.view, el.dataset.arg || ''); },
  'date-prev'() { go('record', addDays(route.date, -1)); },
  'date-next'() { const n = addDays(route.date, 1); if (n <= todayStr()) go('record', n); },
  'date-today'() { go('record', todayStr()); },
  'quick-none'() {
    const day = ensureDay(route.date);
    SLOTS.forEach(s => { day.pain[s.id] = 0; });
    day.impact = 0;
    commitDay(route.date); render();
  },
  pain(el) {
    const day = ensureDay(route.date);
    const v = Number(el.dataset.value), s = el.dataset.slot;
    day.pain[s] = day.pain[s] === v ? null : v;
    commitDay(route.date); render();
  },
  impact(el) {
    const day = ensureDay(route.date);
    const v = Number(el.dataset.value);
    day.impact = day.impact === v ? null : v;
    commitDay(route.date); render();
  },
  'med-add'(el) { addMed(el.dataset.name); },
  'med-new-toggle'() {
    ui.newMedOpen = !ui.newMedOpen; render();
    const i = $('#newMedName'); if (i) i.focus();
  },
  'med-new-add'() {
    const i = $('#newMedName');
    const name = (i ? i.value : '').trim().slice(0, 40);
    if (!name) { toast(T.medsNameEmpty); if (i) i.focus(); return; }
    addMed(name);
  },
  'med-remove'(el) {
    const day = ensureDay(route.date);
    day.meds.splice(Number(el.dataset.index), 1);
    commitDay(route.date, true); render(); toast(T.medsRemoved);
  },
  'med-time-now'(el) { setMedTime(Number(el.dataset.index), nowHM()); },
  'med-time-set'(el) { setMedTime(Number(el.dataset.index), el.dataset.time); },
  'med-effect'(el) {
    const day = ensureDay(route.date);
    const m = day.meds[Number(el.dataset.index)];
    if (!m) return;
    m.effect = m.effect === el.dataset.effect ? null : el.dataset.effect;
    commitDay(route.date); render();
  },
  mens() { const day = ensureDay(route.date); day.menstruation = !day.menstruation; commitDay(route.date); render(); },
  'optional-toggle'() {
    const cur = ui.optionalTouched ? ui.optionalOpen : hasOptional(getDay(route.date) || emptyDay());
    ui.optionalOpen = !cur; ui.optionalTouched = true; render();
  },
  paintype(el) { const day = ensureDay(route.date); day.painType = day.painType === el.dataset.value ? null : el.dataset.value; commitDay(route.date); render(); },
  symptom(el) { const day = ensureDay(route.date); toggleIn(day.symptoms, el.dataset.value); day.symptoms = O.symptoms.map(o => o.id).filter(id => day.symptoms.indexOf(id) >= 0); commitDay(route.date); render(); },
  trigger(el) { const day = ensureDay(route.date); toggleIn(day.triggers, el.dataset.value); day.triggers = O.triggers.map(o => o.id).filter(id => day.triggers.indexOf(id) >= 0); commitDay(route.date); render(); },
  'delete-day'() {
    const date = route.date;
    showModal({ title: esc(T.deleteDayTitle), body: '<p>' + esc(fmt(T.deleteDayBody, { date: fmtDate(date) })) + '</p>', buttons: [
      { label: T.deleteConfirm, cls: 'danger', onClick() { delete data.days[date]; save(); render(); toast(T.deletedDay); } },
      { label: T.cancel, cls: 'primary' },
    ] });
  },
  'month-prev'() { go(route.view, addMonths(route.month, -1)); },
  'month-next'() { const n = addMonths(route.month, 1); if (n <= todayStr().slice(0, 7)) go(route.view, n); },
  'month-now'() { go(route.view, todayStr().slice(0, 7)); },
  'cal-day'(el) { go('record', el.dataset.date); },
  'to-doctor'() { go('doctor', route.month); },
  print() { buildPrintSheet(route.month); window.print(); },
  'export-file'() { exportFile(); },
  'export-share'() { exportShare(); },
  'export-copy'() { exportCopy(); },
  'import-paste-toggle'() { ui.pasteOpen = !ui.pasteOpen; render(); const ta = $('#pasteArea'); if (ta) ta.focus(); },
  'import-paste-run'() { const ta = $('#pasteArea'); importText(ta ? ta.value : ''); },
  'toggle-mens-setting'() { data.settings.showMenstruation = !data.settings.showMenstruation; save(); render(); },
  'med-cand-remove'(el) { data.meds = data.meds.filter(nm => nm !== el.dataset.name); save(); render(); },
  'delete-all'() {
    showModal({ title: esc(T.deleteAllTitle), body: '<p>' + esc(fmt(T.deleteAllBody, { n: Object.keys(data.days).length })) + '</p>', buttons: [
      { label: T.deleteAllConfirm, cls: 'danger', onClick() {
        const keep = data.settings.showMenstruation;
        data = emptyData(); data.settings.showMenstruation = keep;
        if (!DEMO) { try { localStorage.removeItem(C.app.storageKey); } catch (e) {} }
        save(); render(); toast(T.deletedAll);
      } },
      { label: T.cancel, cls: 'primary' },
    ] });
  },
  'reminder-later'() { data.settings.lastReminderAt = new Date().toISOString(); save(); render(); },
  'reminder-now'() { exportFile(); },
  'demo-exit'() { location.href = location.pathname; },
  'modal-btn'(el) { const b = modalButtons && modalButtons[Number(el.dataset.i)]; closeModal(); if (b && b.onClick) b.onClick(); },
  'modal-bg'(el, e) { if (e.target === el) closeModal(); },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const fn = actions[el.dataset.action];
  if (fn) fn(el, e);
});
document.addEventListener('change', e => {
  const el = e.target;
  const k = el.dataset ? el.dataset.change : '';
  if (k === 'date-pick') { if (validDate(el.value)) go('record', el.value > todayStr() ? todayStr() : el.value); }
  else if (k === 'med-time') setMedTime(Number(el.dataset.index), el.value, true);
  else if (k === 'import-file') { const f = el.files && el.files[0]; if (f) readImportFile(f); el.value = ''; }
});
document.addEventListener('input', e => {
  const el = e.target;
  const k = el.dataset ? el.dataset.input : '';
  if (k === 'memo') { ensureDay(route.date).memo = el.value.slice(0, 500); scheduleMemoCommit(); }
  else if (k === 'newmed') ui.newMedDraft = el.value;
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && modalButtons) closeModal();
  if (e.key === 'Enter' && e.target && e.target.id === 'newMedName') { e.preventDefault(); actions['med-new-add'](); }
});
window.addEventListener('beforeprint', () => buildPrintSheet(route.month));
window.addEventListener('pagehide', flushMemo);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushMemo(); });

/* ---------- 起動 ---------- */
function init() {
  document.title = C.app.title + '｜' + C.clinic.name;
  $('#appTitle').textContent = C.app.title;
  $('#clinicName').textContent = C.clinic.name;
  $('#privacyText').textContent = T.privacyBadge;
  $('#privacyBadge').setAttribute('title', N.privacy);
  storageOk = DEMO ? true : storageAvailable();
  if (!DEMO && !data.settings.firstUseAt && Object.keys(data.days).length) data.settings.firstUseAt = new Date().toISOString();
  parseHash();
  if (!location.hash) history.replaceState(null, '', '#record/' + route.date);
  render();
  if (C.features.serviceWorker && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
  }
}
init();
})();
</script>
</body>
</html>
